openapi: 3.2.0
info:
  termsOfService: http://developer.centrify.com/license
  title: Centrify Identity Platform Authentication API
  version: 23.1.261-447315
  description: This site provides basic reference material for the Centrify Identity Platform API.
tags:
- description: Authenticate to cloud service, MFA
  name: Authentication
paths:
  /Acl/CheckRowRight:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RowKey:
                  type: string
                  description: The unique identifier.
                Rights:
                  type: boolean
                  description: The right on the item.
                Table:
                  items:
                    type: string
                  type: array
                  description: Sql table to examine.
              required:
              - RowKey
              - Rights
              - Table
              type: object
        required: true
      x-centrify-anon: false
      summary: Check row ACLs
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclCheckRowRight'
      operationId: postAclCheckRowRight
      x-operation-id-source: derived
  /Acl/GetAce:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: integer
                  description: The ace item ID.
              required:
              - ID
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets a users access rights
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetAce'
      operationId: postAclGetAce
      x-operation-id-source: derived
  /Acl/GetCollectionAces:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RowKey:
                  type: string
                  description: Unique identifier.
                ReduceSysadmin:
                  type: boolean
                  description: Prevent generic cloud admin accounts from having access (default=false).
                Table:
                  items:
                    type: string
                  type: array
                  description: The table to access.
              required:
              - RowKey
              - ReduceSysadmin
              - Table
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a collection of access rights
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetCollectionAces'
      operationId: postAclGetCollectionAces
      x-operation-id-source: derived
  /Acl/GetDirAces:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Path:
                  type: string
                  description: Path to the folder being examined.
                Inherit:
                  type: boolean
                  description: Use inheritance (default=true).
              required:
              - Path
              type: object
        required: true
      x-centrify-anon: false
      summary: Retrieves a list of who has what rights for the directory
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetDirAces'
      operationId: postAclGetDirAces
      x-operation-id-source: derived
  /Acl/GetEffectiveDirRights:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Paths:
                  items:
                    type: string
                    description: A directory path.
                  type: array
                  description: A list of directories.
              required:
              - Paths
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets a list of directory rights
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetEffectiveDirRights'
      operationId: postAclGetEffectiveDirRights
      x-operation-id-source: derived
  /Acl/GetEffectiveFileRights:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Paths:
                  items:
                    type: string
                    description: A file.
                  type: array
                  description: List of files to examine for rights.
              required:
              - Paths
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets a list of file rights
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetEffectiveFileRights'
      operationId: postAclGetEffectiveFileRights
      x-operation-id-source: derived
  /Acl/GetEffectiveRowRights:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Rows:
                  items:
                    properties:
                      RowKey:
                        type: string
                        description: The unique identifer.
                      ReduceSysadmin:
                        type: boolean
                        description: Prevent generic cloud admin accounts from having access (default=false).
                      Table:
                        type: string
                        description: Database table name.
                    type: object
                    description: A row of user rights.
                  type: array
                  description: Row rights of the user to look for.
              required:
              - Rows
              type: object
        required: true
      x-centrify-anon: false
      description: Only returns value if current user has at least read-rights.
      summary: Gets a list of row rights
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetEffectiveRowRights'
      operationId: postAclGetEffectiveRowRights
      x-operation-id-source: derived
  /Acl/GetFileAces:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Inherit:
                  type: boolean
                  description: Use inheritance.
                Paths:
                  items:
                    type: string
                  type: array
                  description: Path to the file.
              required:
              - Inherit
              - Paths
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets ACLs on a file
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetFileAces'
      operationId: postAclGetFileAces
      x-operation-id-source: derived
  /Acl/GetRowAces:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RowKey:
                  type: string
                  description: The unique identifier.
                ReduceSysadmin:
                  type: boolean
                  description: Prevent generic cloud admin accounts from having access (default=false).
                Inherit:
                  type: boolean
                  description: Use inheritance (default=true).
                Table:
                  type: string
                  description: The sql table to examine.
              required:
              - RowKey
              - Table
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets the access rights for a row
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetRowAces'
      operationId: postAclGetRowAces
      x-operation-id-source: derived
  /AuthProfile/DeleteProfile:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: Authentication UUID.
        name: uuid
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload21'
      x-centrify-anon: false
      summary: Deletes an authentication profile
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthProfileDeleteProfile'
      operationId: postAuthProfileDeleteProfile
      x-operation-id-source: derived
  /AuthProfile/GetProfile:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: Profile UUID
        name: uuid
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload21'
      x-centrify-anon: false
      description: The profile get uses the uuid passed in by method call or as part of the payload.
      summary: Gets an authentication profile
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthProfileGetProfile'
      operationId: postAuthProfileGetProfile
      x-operation-id-source: derived
  /AuthProfile/GetProfileList:
    post:
      tags:
      - Authentication
      x-centrify-anon: false
      summary: Gets a list of Authentication profiles
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthProfileGetProfileList'
      operationId: postAuthProfileGetProfileList
      x-operation-id-source: derived
  /AuthProfile/SaveProfile:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                settings:
                  properties:
                    Challenges:
                      items:
                        type: string
                      type: array
                      description: Selected authentication mechanisms.
                    AdditionalData:
                      type: object
                      description: DataEntity with additional data (default=null).
                    Uuid:
                      type: string
                      description: Profile UUID.
                    DurationInMinutes:
                      type: integer
                      description: How many minutes the profile is valid.
                    Name:
                      type: string
                      description: Profile name.
                  type: object
                  description: The authentication profile.
              required:
              - settings
              type: object
        required: true
      x-centrify-anon: false
      description: If the profile contains a UUID an update is performed, otherwise it's a write.
      summary: Saves an authentication profile
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthProfileSaveProfile'
      operationId: postAuthProfileSaveProfile
      x-operation-id-source: derived
  /CDirectoryService/RefreshToken:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: User UUID to refresh
        name: ID
        schema:
          type: string
      - required: false
        in: query
        description: UUID of the user's directory service (default=null)
        name: directoryServiceUuid
        schema:
          type: string
      x-centrify-anon: false
      description: 'You must be a system administrator or have user management permissions. User cached identity in the cloud is reloaded from their directory service.

        Useful when user details have changed in their remote directory service, but have not yet been pushed to the cloud.'
      summary: Refresh a user's cached identity
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceRefreshToken'
      operationId: postCDirectoryServiceRefreshToken
      x-operation-id-source: derived
  /Collection/IsMember:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                directHint:
                  type: boolean
                  description: ''
                ID:
                  type: integer
                  description: The uuid reference to a collection.
                recurse:
                  type: boolean
                  description: Look for children (default=false).
                Table:
                  type: string
                  description: Member table.
                Key:
                  type: string
                  description: The key to use when examining the table.
              required:
              - ID
              - Table
              - Key
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets the members with access to the set
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CollectionIsMember'
      operationId: postCollectionIsMember
      x-operation-id-source: derived
  /OAuth2/Authorize:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: Value used to determine if authentication has occured.
        name: bounce
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload15'
      x-centrify-anon: true
      description: 'Calls defined by RFC(s). May alternately redirect to another login page or throw an exceptoin depending on success.

        See the OAuth2 spec https://oauth.net/2/'
      summary: Authenticates a request
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2Authorize'
      operationId: postOAuth2Authorize
      x-operation-id-source: derived
  /OAuth2/Confirm:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: Value used to determine if authentication has occured.
        name: bounce
        schema:
          type: string
      - required: true
        in: query
        description: Has user denied confirmation.
        name: result
        schema:
          type: string
      - required: true
        in: query
        description: Comma delimited list of scope ids.
        name: scopes
        schema:
          type: string
      x-centrify-anon: false
      description: 'Calls defined by RFC(s).

        See the OAuth2 spec https://oauth.net/2/'
      summary: Confirm
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2Confirm'
      operationId: postOAuth2Confirm
      x-operation-id-source: derived
  /OAuth2/EndSession:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: ''
        name: post_logout_redirect_uri
        schema:
          type: string
      - required: true
        in: query
        description: ''
        name: state
        schema:
          type: string
      - required: true
        in: query
        description: ''
        name: id_token_hint
        schema:
          type: string
      x-centrify-anon: true
      summary: https://openid.net/specs/openid-connect-session-1_0.html#RPLogout
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2EndSession'
      operationId: postOAuth2EndSession
      x-operation-id-source: derived
  /OAuth2/Introspect:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
                  description: The authentication token to process.
              required:
              - token
              type: object
        required: true
      x-centrify-anon: true
      description: See the OAuth2 spec https://oauth.net/2/
      summary: Introspect
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2Introspect'
      operationId: postOAuth2Introspect
      x-operation-id-source: derived
  /OAuth2/Keys:
    post:
      tags:
      - Authentication
      requestBody:
        $ref: '#/components/requestBodies/Payload31'
      x-centrify-anon: true
      description: See the OAuth2 spec https://oauth.net/2/
      summary: Keys
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2Keys'
      operationId: postOAuth2Keys
      x-operation-id-source: derived
  /OAuth2/Revoke:
    post:
      tags:
      - Authentication
      x-centrify-anon: true
      description: See the OAuth2 spec https://oauth.net/2/
      summary: Revoke
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2Revoke'
      operationId: postOAuth2Revoke
      x-operation-id-source: derived
  /OAuth2/Token:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                grant_type:
                  type: string
                  description: Grant what type of token.
              required:
              - grant_type
              type: object
        required: true
      x-centrify-anon: true
      description: See the OAuth2 spec https://oauth.net/2/
      summary: Gets a token based on grant type
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2Token'
      operationId: postOAuth2Token
      x-operation-id-source: derived
  /OAuth2/UserInfo:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Scopes:
                  items:
                    type: string
                    description: A scope id.
                  type: array
                  description: A list of scope ids.
              required:
              - Scopes
              type: object
        required: true
      x-centrify-anon: false
      description: 'Not anonymous.

        See the OAuth2 spec https://oauth.net/2/'
      summary: This returns the contents of the bearer token used
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2UserInfo'
      operationId: postOAuth2UserInfo
      x-operation-id-source: derived
  /OAuth2Man/CreateClientToken:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                AppID:
                  type: string
                  description: The application id.
                ClientSecret:
                  type: string
                  description: The client secret.
                ClientID:
                  type: string
                  description: The client id.
              required:
              - AppID
              - ClientSecret
              - ClientID
              type: object
        required: true
      x-centrify-anon: false
      summary: Creates a client token
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2ManCreateClientToken'
      operationId: postOAuth2ManCreateClientToken
      x-operation-id-source: derived
  /Security/AdvanceAuthentication:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                TenantId:
                  type: string
                  description: Tenant ID/suffix returned by the call that started the authentication session
                Action:
                  type: string
                  description: What action to take with respect to the supplied MechanismId (answer it, send ood challenge, wait for oob response, etc.).
                PersistentLogin:
                  type: boolean
                  description: Flag indicating if the user's session should persist after closing the browser
                SessionId:
                  type: string
                  description: Session ID returned by the call that started the authentication session
                MechanismId:
                  type: string
                  description: Mechanism ID that you wish to advance.
                Answer:
                  type: string
                  description: For answerable mechanisms, the value that will satisfy the qustion (password, security code, etc.)
              required:
              - Action
              - SessionId
              - MechanismId
              type: object
        required: true
      x-centrify-anon: true
      description: 'When things are going smoothly, you can expect to get a ''StartNextChallenge'' or ''LoginSuccess'' response, however the system may (at any time)

        return a new Mfa Package which may add, remove or change challenges. Failure cases typically result in an ''Undefined'' error message when things are

        misconfigured and a "LoginFailure'' message when incorrect answers have terminated the session (which may have been sent in previous calls to this API).'
      summary: Attempt to advance the state of an authentication session
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityAdvanceAuthentication'
      operationId: postSecurityAdvanceAuthentication
      x-operation-id-source: derived
  /Security/AdvanceForgotUsername:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                TenantId:
                  type: string
                  description: The tenant id.
                Action:
                  type: string
                  description: The payload key action.
                Answer:
                  type: string
                  description: The answer.
              required:
              - TenantId
              - Action
              - Answer
              type: object
        required: true
      x-centrify-anon: true
      description: Handles and mfa-like package with a single challenge (special case 'ForgotUsername' package).
      summary: Advances a forgot username session (similar to MFA advance authentication)
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityAdvanceForgotUsername'
      operationId: postSecurityAdvanceForgotUsername
      x-operation-id-source: derived
  /Security/AnswerOOBChallenge:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: The answer to verify against.
        name: answer
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload15'
      x-centrify-anon: true
      description: 'Invoked by 3rd party services for answering out of band challenges.

        (text messages or email, not PhoneFactor)

        Supports the click on link scenario.'
      summary: 'MultiFactor Auth support: answer out of band challenge'
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityAnswerOOBChallenge'
      operationId: postSecurityAnswerOOBChallenge
      x-operation-id-source: derived
  /Security/ChallengeUser:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: What authentication profile to use.
        name: profileName
        schema:
          type: string
      x-centrify-anon: false
      description: 'ie. a challenge based on the passed authentication profile.

        Pattern: Allow AuthChallengeHelper to check challenge and throw an AuthChallengeException if challenge is needed

        JsonRest.StandardJsonResult will catch the exception and transform it to a challenge response.'
      summary: Determines if user needs step-up authentication
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityChallengeUser'
      operationId: postSecurityChallengeUser
      x-operation-id-source: derived
  /Security/CleanupAuthentication:
    post:
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              properties:
                TenantId:
                  type: string
                  description: Tenant ID/suffix returned by the call that started the authentication session
                SessionId:
                  type: string
                  description: Session ID returned by the call that started the authentication session
              required:
              - TenantId
              - SessionId
              type: object
        required: true
      x-centrify-anon: true
      description: Does not affect completed authentication sessions.
      summary: Terminate an incomplete session started with StartAuthentication or…
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityCleanupAuthentication'
      operationId: postSecurityCleanupAuthentication
      x-operation-id-source: derived
  /Security/GetOneTimePassword:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: What's the password being used for.
        name: use
        schema:
          type: string
      x-centrify-anon: false
      summary: Fetches a one-time passcode for the specified use
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityGetOneTimePassword'
      operationId: postSecurityGetOneTimePassword
      x-operation-id-source: derived
  /Security/GetRiskAnalysisLevels:
    post:
      tags:
      - Authentication
      x-centrify-anon: false
      summary: Gets a list of risk levels
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityGetRiskAnalysisLevels'
      operationId: postSecurityGetRiskAnalysisLevels
      x-operation-id-source: derived
  /Security/Login:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: The customer processing the login.
        name: systemID
        schema:
          type: string
      - required: true
        in: query
        description: The user trying to login.
        name: user
        schema:
          type: string
      - required: true
        in: query
        description: The user password.
        name: password
        schema:
          type: string
      - required: true
        in: query
        description: The persist state given to the cookie.
        name: persist
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload15'
      x-centrify-anon: true
      deprecated: true
      description: Please use StartAuthentication/AdvanceAuthentication.
      summary: Deprecated -- User login
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityLogin'
      operationId: postSecurityLogin
      x-operation-id-source: derived
  /Security/Logout:
    post:
      tags:
      - Authentication
      parameters:
      - required: true
        in: query
        description: Where to go next.
        name: redirectUrl
        schema:
