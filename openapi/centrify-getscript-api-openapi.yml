paths:
  /GetScript:
    post:
      summary: /saasManage/GetScript
      description: Gets the existing script for the specified application.
      operationId: saasmanagegetscript
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appkey:
                  type: string
                  description: The unique ID of the application to retrieve the script for.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{  \n   \"success\":true,\n   \"Result\":{  \n      \"Modified\":true,\n      \"Script\":\"setIssuer(Issuer);\\nsetSubjectName(UserIdentifier);\\nsetAudience('box.net');\\nsetRecipient('https://sso.services.box.net/sp/ACS.saml2');\\nsetSignatureType('Response');\\nsetServiceUrl('https://sso.services.box.net/sp/ACS.saml2');\\nsetHttpDestination('https://sso.services.box.net/sp/ACS.saml2');\\nsetAttribute('Email Address', UserIdentifier);\"\n   },\n   \"Message\":null,\n   \"MessageID\":null,\n   \"Exception\":null,\n   \"ErrorID\":null,\n   \"ErrorCode\":null,\n   \"InnerExceptions\":null\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  Result:
                    type: object
                    properties:
                      Modified:
                        type: boolean
                        example: true
                        default: true
                      Script:
                        type: string
                        example: 'setIssuer(Issuer);

                          setSubjectName(UserIdentifier);

                          setAudience(''box.net'');

                          setRecipient(''https://sso.services.box.net/sp/ACS.saml2'');

                          setSignatureType(''Response'');

                          setServiceUrl(''https://sso.services.box.net/sp/ACS.saml2'');

                          setHttpDestination(''https://sso.services.box.net/sp/ACS.saml2'');

                          setAttribute(''Email Address'', UserIdentifier);'
                  Message: {}
                  MessageID: {}
                  Exception: {}
                  ErrorID: {}
                  ErrorCode: {}
                  InnerExceptions: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
