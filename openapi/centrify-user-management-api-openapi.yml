openapi: 3.2.0
info:
  termsOfService: http://developer.centrify.com/license
  title: Centrify Identity Platform User Management API
  version: 23.1.261-447315
  description: This site provides basic reference material for the Centrify Identity Platform API.
tags:
- description: Manage users for all Directory Services (AD, Cloud, LDAP, etc)
  name: User Management
paths:
  /Acl/GetEffectiveRowRights:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Rows:
                  items:
                    properties:
                      RowKey:
                        type: string
                        description: The unique identifer.
                      ReduceSysadmin:
                        type: boolean
                        description: Prevent generic cloud admin accounts from having access (default=false).
                      Table:
                        type: string
                        description: Database table name.
                    type: object
                    description: A row of user rights.
                  type: array
                  description: Row rights of the user to look for.
              required:
              - Rows
              type: object
        required: true
      x-centrify-anon: false
      description: Only returns value if current user has at least read-rights.
      summary: Gets a list of row rights
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AclGetEffectiveRowRights'
      operationId: postAclGetEffectiveRowRights
      x-operation-id-source: derived
  /CDirectoryService/BulkDeleteUsers:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Users:
                  type: string
                  description: List of users for removal.
              required:
              - Users
              type: object
        required: true
      x-centrify-anon: false
      deprecated: true
      description: Deprecated -- use UserMgmt/RemoveUsers() instead.
      summary: Deprecated -- Delete a list of users with permission check
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceBulkDeleteUsers'
      operationId: postCDirectoryServiceBulkDeleteUsers
      x-operation-id-source: derived
  /CDirectoryService/CreateUserBulk:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Password:
                  type: string
                  description: URL encoded password of the user (default=randomly generated strong password).
                CmaRedirectedUserUuid:
                  type: string
                  description: Centrify mobile authenticator redirected user uuid.
                HomeNumber:
                  type: string
                  description: User's home number (default=null).
                ReportsTo:
                  type: string
                  description: Uuid of user this user reports to (default=null).
                PasswordNeverExpire:
                  type: boolean
                  description: User's password never expires (default=false).
                DisplayName:
                  type: string
                  description: Display name of user (default=null).
                SendSmsInvite:
                  type: boolean
                  description: Send user an sms invite to enroll their mobile device in the protal (default=false).
                OfficeNumber:
                  type: string
                  description: User's office number (default=null).
                ForcePasswordChangeNext:
                  type: boolean
                  description: Force password change at first login (default=true).
                InSysAdminRole:
                  type: boolean
                  description: Place user in System Adminstrator role (default=false).
                MobileNumber:
                  type: string
                  description: User's mobile number (default=null); note this field is required if SendSmsInvite is true.
                InEverybodyRole:
                  type: boolean
                  description: Place user in Everybody role (default=true).
                ServiceUser:
                  type: boolean
                  description: User is a service user (default=false).
                Mail:
                  type: string
                  description: Email of user (default=null); note this field is required if 'SendEmailInvite' is true.
                SendEmailInvite:
                  type: boolean
                  description: Send user an email invite to the portal (default=true).
                Description:
                  type: string
                  description: Description of user (default=null).
                Name:
                  type: string
                  description: Name of user.
              required:
              - Name
              type: object
        required: true
      x-centrify-anon: false
      description: 'You must be a system administrator or have user management permissions.

        Specifying ''ServiceUser'' will override the ''InEveryBodyRole'' property if both are provided.


        The file(s) must conform to the following format:'
      summary: Create new users in the Cloud Directory Service based on data read from files
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceCreateUserBulk'
      operationId: postCDirectoryServiceCreateUserBulk
      x-operation-id-source: derived
  /CDirectoryService/Delete:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: User UUID or Name to delete.
        name: id
        schema:
          type: string
      x-centrify-anon: false
      deprecated: true
      summary: Delete user after permission check (DEPRECATED)
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceDelete'
      operationId: postCDirectoryServiceDelete
      x-operation-id-source: derived
  /CDirectoryService/ExemptUserFromMfa:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: User UUID to except from MFA
        name: ID
        schema:
          type: string
      - required: false
        in: query
        description: Amount of time to exempt the user from MFA (default=10 minutes)
        name: timespan
        schema:
          type: integer
      x-centrify-anon: false
      description: You must be a system administrator or have user management permissions. User is exempt from MFA login for a specified amount of time.
      summary: Exempt a specified user from MFA login for a period of time
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceExemptUserFromMfa'
      operationId: postCDirectoryServiceExemptUserFromMfa
      x-operation-id-source: derived
  /CDirectoryService/GetBulkImportWithExtAtt:
    post:
      tags:
      - User Management
      x-centrify-anon: false
      summary: Bulk imports users from csv file
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceGetBulkImportWithExtAtt'
      operationId: postCDirectoryServiceGetBulkImportWithExtAtt
      x-operation-id-source: derived
  /CDirectoryService/GetUserAttributes:
    post:
      tags:
      - User Management
      x-centrify-anon: false
      summary: Get details for the current user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceGetUserAttributes'
      operationId: postCDirectoryServiceGetUserAttributes
      x-operation-id-source: derived
  /CDirectoryService/GetUsersFromCsvFile:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                FileName:
                  properties:
                    Password:
                      type: string
                      description: URL encoded password of the user (default=randomly generated strong password).
                    CmaRedirectedUserUuid:
                      type: string
                      description: Centrify mobile authenticator redirected user uuid.
                    HomeNumber:
                      type: string
                      description: User's home number (default=null).
                    ReportsTo:
                      type: string
                      description: Uuid of user this user reports to (default=null).
                    PasswordNeverExpire:
                      type: boolean
                      description: User's password never expires (default=false).
                    DisplayName:
                      type: string
                      description: Display name of user (default=null).
                    SendSmsInvite:
                      type: boolean
                      description: Send user an sms invite to enroll their mobile device in the protal (default=false).
                    OfficeNumber:
                      type: string
                      description: User's office number (default=null).
                    ForcePasswordChangeNext:
                      type: boolean
                      description: Force password change at first login (default=true).
                    InSysAdminRole:
                      type: boolean
                      description: Place user in System Adminstrator role (default=false).
                    MobileNumber:
                      type: string
                      description: User's mobile number (default=null); note this field is required if SendSmsInvite is true.
                    InEverybodyRole:
                      type: boolean
                      description: Place user in Everybody role (default=true).
                    ServiceUser:
                      type: boolean
                      description: User is a service user (default=false).
                    Mail:
                      type: string
                      description: Email of user (default=null); note this field is required if 'SendEmailInvite' is true.
                    SendEmailInvite:
                      type: boolean
                      description: Send user an email invite to the portal (default=true).
                    Description:
                      type: string
                      description: Description of user (default=null).
                    Name:
                      type: string
                      description: Name of user.
                  type: object
                  description: The csv file containing user information.
              required:
              - FileName
              type: object
        required: true
      x-centrify-anon: false
      description: After a successful call of this API, follow up with the SubmitUploadedFile API to perform the bulk user import.
      summary: Reads users from a csv file(s) for bulk user import
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceGetUsersFromCsvFile'
      operationId: postCDirectoryServiceGetUsersFromCsvFile
      x-operation-id-source: derived
  /CDirectoryService/RefreshToken:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: User UUID to refresh
        name: ID
        schema:
          type: string
      - required: false
        in: query
        description: UUID of the user's directory service (default=null)
        name: directoryServiceUuid
        schema:
          type: string
      x-centrify-anon: false
      description: 'You must be a system administrator or have user management permissions. User cached identity in the cloud is reloaded from their directory service.

        Useful when user details have changed in their remote directory service, but have not yet been pushed to the cloud.'
      summary: Refresh a user's cached identity
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceRefreshToken'
      operationId: postCDirectoryServiceRefreshToken
      x-operation-id-source: derived
  /CDirectoryService/SubmitUploadedFile:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ReturnID:
                  type: string
                  description: Identifier of previously uploaded file
                AdminEmail:
                  type: string
                  description: Email to send summary report to upon completion (default=email of current user)
                SendSmsInvite:
                  type: boolean
                  description: Send SMS invites to imported users (default=false)
                SendEmailInvite:
                  type: boolean
                  description: Send EMail invites to imported users (default=false)
              required:
              - ReturnID
              type: object
        required: true
      x-centrify-anon: false
      description: Use this API after a successful GetUsersFromCsvFile, to perform the bulk user import.
      summary: Create a Bulk User Import scheduled task to process an uploaded file
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CDirectoryServiceSubmitUploadedFile'
      operationId: postCDirectoryServiceSubmitUploadedFile
      x-operation-id-source: derived
  /Collection/GetMembers:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: integer
                  description: The uuid reference to a collection.
                recurse:
                  type: boolean
                  description: Determines if Effective or Declared members are returned. (default=false).
              required:
              - ID
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets the members with access to the set
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CollectionGetMembers'
      operationId: postCollectionGetMembers
      x-operation-id-source: derived
  /Federation/GetFederatedGroupMembers:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Group:
                  type: string
                  description: UUID of the group
                PageNumber:
                  type: integer
                  description: Zero indexed page number of the results to fetch (use 0 when requesting all rows).
                PageSize:
                  type: integer
                  description: Number of records to return (use 0 when requesting all rows).
              required:
              - Group
              type: object
        required: true
      x-centrify-anon: false
      summary: Retreives a list of users that are members of a specific federated group
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FederationGetFederatedGroupMembers'
      operationId: postFederationGetFederatedGroupMembers
      x-operation-id-source: derived
  /Federation/GetFederatedGroupsForUser:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                User:
                  type: string
                  description: UUID of the user
              required:
              - User
              type: object
        required: true
      x-centrify-anon: false
      summary: Retrieves the Federated Group Memberships for a specfic user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FederationGetFederatedGroupsForUser'
      operationId: postFederationGetFederatedGroupsForUser
      x-operation-id-source: derived
  /Federation/RemoveUserFromFederatedGroup:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Federation:
                  type: string
                  description: UUID of the federation that granted membership previously and we're now revoking membership from. If omitted, the user will be removed from the group completely (no memberships will remain granted from any federation)
                Group:
                  type: string
                  description: UUID of the group
                User:
                  type: string
                  description: UUID of the user
              required:
              - Group
              - User
              type: object
        required: true
      x-centrify-anon: false
      summary: Revokes federated group membership from a specific group for a specific user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FederationRemoveUserFromFederatedGroup'
      operationId: postFederationRemoveUserFromFederatedGroup
      x-operation-id-source: derived
  /Security/AnswerOOBChallenge:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: The answer to verify against.
        name: answer
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload15'
      x-centrify-anon: true
      description: 'Invoked by 3rd party services for answering out of band challenges.

        (text messages or email, not PhoneFactor)

        Supports the click on link scenario.'
      summary: 'MultiFactor Auth support: answer out of band challenge'
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityAnswerOOBChallenge'
      operationId: postSecurityAnswerOOBChallenge
      x-operation-id-source: derived
  /Security/ChallengeUser:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: What authentication profile to use.
        name: profileName
        schema:
          type: string
      x-centrify-anon: false
      description: 'ie. a challenge based on the passed authentication profile.

        Pattern: Allow AuthChallengeHelper to check challenge and throw an AuthChallengeException if challenge is needed

        JsonRest.StandardJsonResult will catch the exception and transform it to a challenge response.'
      summary: Determines if user needs step-up authentication
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityChallengeUser'
      operationId: postSecurityChallengeUser
      x-operation-id-source: derived
  /Security/GetOneTimePassword:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: What's the password being used for.
        name: use
        schema:
          type: string
      x-centrify-anon: false
      summary: Fetches a one-time passcode for the specified use
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityGetOneTimePassword'
      operationId: postSecurityGetOneTimePassword
      x-operation-id-source: derived
  /Security/Login:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: The customer processing the login.
        name: systemID
        schema:
          type: string
      - required: true
        in: query
        description: The user trying to login.
        name: user
        schema:
          type: string
      - required: true
        in: query
        description: The user password.
        name: password
        schema:
          type: string
      - required: true
        in: query
        description: The persist state given to the cookie.
        name: persist
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload15'
      x-centrify-anon: true
      deprecated: true
      description: Please use StartAuthentication/AdvanceAuthentication.
      summary: Deprecated -- User login
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityLogin'
      operationId: postSecurityLogin
      x-operation-id-source: derived
  /Security/Logout:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: Where to go next.
        name: redirectUrl
        schema:
          type: string
      - required: true
        in: query
        description: Allow windows authentication.
        name: allowIWA
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload15'
      x-centrify-anon: true
      description: 'The user will be redirected to redirectUrl if it is present.

        RedirectUrl can be external or relative.'
      summary: Logout current user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityLogout'
      operationId: postSecurityLogout
      x-operation-id-source: derived
  /Security/RefreshToken:
    post:
      tags:
      - User Management
      x-centrify-anon: false
      description: User cached identity in the cloud is reloaded from their directory service. Useful when user details have changed in their remote directory service, but have not yet been pushed to the cloud.
      summary: Refresh current user's cached identity
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityRefreshToken'
      operationId: postSecurityRefreshToken
      x-operation-id-source: derived
  /Security/StartSocialAuthentication:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                PostExtIdpAuthCallbackUrl:
                  type: string
                  description: Where the Idp should send the user after authentication.
                IdpName:
                  type: string
                  description: The identity provider name (Facebook, Google, Twitter, LinkedIn, Microsoft).
              required:
              - PostExtIdpAuthCallbackUrl
              - IdpName
              type: object
        required: true
      x-centrify-anon: true
      summary: Start social authentication
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityStartSocialAuthentication'
      operationId: postSecurityStartSocialAuthentication
      x-operation-id-source: derived
  /Security/TaskCheck:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: The task.
        name: Task
        schema:
          type: string
      x-centrify-anon: false
      summary: Checks to see if user has execute rights on the task
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityTaskCheck'
      operationId: postSecurityTaskCheck
      x-operation-id-source: derived
  /Security/TaskChecks:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                tasks:
                  items:
                    type: string
                  type: array
                  description: A list of tasks.
              required:
              - tasks
              type: object
        required: true
      x-centrify-anon: false
      summary: Checks to see if user has execute rights on a list of tasks
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityTaskChecks'
      operationId: postSecurityTaskChecks
      x-operation-id-source: derived
  /Security/TwilioPhoneChallengeCompleted:
    post:
      tags:
      - User Management
      requestBody:
        $ref: '#/components/requestBodies/Payload14'
      x-centrify-anon: true
      description: Invoked by 3rd party services answering twilio messages.
      summary: Looks for the multi auth customer response
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityTwilioPhoneChallengeCompleted'
      operationId: postSecurityTwilioPhoneChallengeCompleted
      x-operation-id-source: derived
  /Security/TwilioPhoneChallengeNotAnswered:
    post:
      tags:
      - User Management
      requestBody:
        $ref: '#/components/requestBodies/Payload14'
      x-centrify-anon: true
      description: Invoked by 3rd party services answering twilio messages.
      summary: Looks for the multi auth customer response
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityTwilioPhoneChallengeNotAnswered'
      operationId: postSecurityTwilioPhoneChallengeNotAnswered
      x-operation-id-source: derived
  /Security/WhoAmI:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: Not used.
        name: challenge
        schema:
          type: string
      x-centrify-anon: true
      summary: Confirms user authentication state
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SecurityWhoAmI'
      operationId: postSecurityWhoAmI
      x-operation-id-source: derived
  /ServerAgent/GetEffectiveLocalGroups:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: The user name.
        name: username
        schema:
          type: string
      - required: true
        in: query
        description: The user uuid.
        name: useruuid
        schema:
          type: string
      - required: true
        in: query
        description: The resource id.
        name: resourceId
        schema:
          type: string
      x-centrify-anon: false
      summary: Get effective local groups
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServerAgentGetEffectiveLocalGroups'
      operationId: postServerAgentGetEffectiveLocalGroups
      x-operation-id-source: derived
  /TenantConfig/DeleteAdminSecurityQuestion:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: Uuid of the question to delete.
        name: Id
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Id:
                  type: string
                  description: Uuid of the question to delete
              required:
              - Id
              type: object
        required: true
      x-centrify-anon: false
      summary: Delete admin security question
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantConfigDeleteAdminSecurityQuestion'
      operationId: postTenantConfigDeleteAdminSecurityQuestion
      x-operation-id-source: derived
  /TenantConfig/GetAdminSecurityQuestion:
    post:
      tags:
      - User Management
      parameters:
      - required: true
        in: query
        description: Uuid of the question.
        name: Id
        schema:
          type: string
      x-centrify-anon: false
      summary: Get a specific admin security question
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantConfigGetAdminSecurityQuestion'
      operationId: postTenantConfigGetAdminSecurityQuestion
      x-operation-id-source: derived
  /TenantConfig/GetAdminSecurityQuestions:
    post:
      tags:
      - User Management
      x-centrify-anon: false
      summary: Get admin security questions
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantConfigGetAdminSecurityQuestions'
      operationId: postTenantConfigGetAdminSecurityQuestions
      x-operation-id-source: derived
  /TenantConfig/SetAdminSecurityQuestion:
    post:
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Culture:
                  default: all
                  type: string
                  description: Culture of the question to add.
                Question:
                  type: string
                  description: Test of the question to add.
              required:
              - Question
              type: object
        required: true
      x-centrify-anon: false
      summary: Add admin security question
