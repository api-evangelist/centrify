openapi: 3.2.0
info:
  termsOfService: http://developer.centrify.com/license
  title: Centrify Identity Platform Resource Management API
  version: 23.1.261-447315
  description: This site provides basic reference material for the Centrify Identity Platform API.
tags:
- description: Manage resources and accounts for CPS
  name: Resource Management
paths:
  /Aws/AddAccessKey:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                AccessKeyId:
                  type: string
                  description: The AWS access key ID.
                AccountId:
                  type: string
                  description: The PAS account ID of the IAM user.
                SecretAccessKey:
                  type: string
                  description: The AWS secret access key.
              required:
              - AccessKeyId
              - AccountId
              - SecretAccessKey
              type: object
        required: true
      x-centrify-anon: false
      description: The access key must already exist in AWS.
      summary: Add an AWS Access Key and Secret
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsAddAccessKey'
      operationId: postAwsAddAccessKey
      x-operation-id-source: derived
  /Aws/DeleteAccessKey:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload23'
      x-centrify-anon: false
      description: The key is removed from PAS, but the access key in AWS is uneffected.
      summary: Deletes an access key for an IAM user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsDeleteAccessKey'
      operationId: postAwsDeleteAccessKey
      x-operation-id-source: derived
  /Aws/DeployConnector:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                KeyPairName:
                  type: string
                  description: The AWS key pair name to assign when launching instance.
                Region:
                  type: string
                  description: The AWS region to launch instance.
                SecurityGroupId:
                  type: string
                  description: The AWS security group ID to attach to the instance.  If not specified one will be created
                InstanceName:
                  type: string
                  description: The value for the Name tag for the instance
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                VpcId:
                  type: string
                  description: The AWS VPC when launching instance.
                InstanceProfileArn:
                  type: string
                  description: ARN of an instance profile associated with an IAM role for the instance
                AmiId:
                  type: string
                  description: The AmiId of the desired windows instance
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - KeyPairName
              - Region
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Launch an Ec2 instance and install a connector registered to this tenant
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsDeployConnector'
      operationId: postAwsDeployConnector
      x-operation-id-source: derived
  /Aws/GetAccessKeys:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: string
                  description: The database ID for the IAM user.
              required:
              - ID
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets Access Keys for an IAM user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetAccessKeys'
      operationId: postAwsGetAccessKeys
      x-operation-id-source: derived
  /Aws/GetAvailabilityZones:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Region:
                  type: string
                  description: The AWS region of interest.
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                RRFormat:
                  type: string
                  description: 'Should response by in the redrock format (default: false) .'
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - Region
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a List of all AWS availability zones in a given region
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetAvailabilityZones'
      operationId: postAwsGetAvailabilityZones
      x-operation-id-source: derived
  /Aws/GetCentrifyAwsAccountInfo:
    post:
      tags:
      - Resource Management
      x-centrify-anon: false
      summary: Get the Centrify AWS Account ID and External ID for the tenant
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetCentrifyAwsAccountInfo'
      operationId: postAwsGetCentrifyAwsAccountInfo
      x-operation-id-source: derived
  /Aws/GetConnectorsForRegions:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload2'
      x-centrify-anon: false
      summary: Get a list of VPC's along with information about connector(s) servicing the VPC
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetConnectorsForRegions'
      operationId: postAwsGetConnectorsForRegions
      x-operation-id-source: derived
  /Aws/GetEc2IamRoles:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a list of all roles for EC2 instances
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetEc2IamRoles'
      operationId: postAwsGetEc2IamRoles
      x-operation-id-source: derived
  /Aws/GetKeyPairs:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Region:
                  type: string
                  description: The AWS region to launch instance.
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                RRFormat:
                  type: string
                  description: 'Should response by in the redrock format (default: false) .'
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - Region
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a List of all ssh keypairs in a given region
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetKeyPairs'
      operationId: postAwsGetKeyPairs
      x-operation-id-source: derived
  /Aws/GetRegionNames:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload24'
      x-centrify-anon: false
      summary: Get region names
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetRegionNames'
      operationId: postAwsGetRegionNames
      x-operation-id-source: derived
  /Aws/GetRegions:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload24'
      x-centrify-anon: false
      summary: Get a List of all aws regions
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetRegions'
      operationId: postAwsGetRegions
      x-operation-id-source: derived
  /Aws/GetSecurityGroups:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Region:
                  type: string
                  description: The AWS region.
                IncludeDeploymentSecurityGroup:
                  type: string
                  description: If true, return a place-holder security group for connector deployment even if it does not yet exist.
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                VpcId:
                  type: string
                  description: The AWS VpcId in which to list security groups.
                RRFormat:
                  type: string
                  description: 'Should response by in the redrock format (default: false) .'
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - Region
              - IncludeDeploymentSecurityGroup
              - VpcId
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a list of all security groups in a region
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetSecurityGroups'
      operationId: postAwsGetSecurityGroups
      x-operation-id-source: derived
  /Aws/GetSubnets:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Region:
                  type: string
                  description: The AWS region of the VPC.
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                VpcId:
                  type: string
                  description: The AWS VpcId in which to list subnets.
                RRFormat:
                  type: string
                  description: 'Should response by in the redrock format (default: false) .'
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - Region
              - VpcId
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a list of all subnets in a given VPC
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetSubnets'
      operationId: postAwsGetSubnets
      x-operation-id-source: derived
  /Aws/GetSubnetsForRegions:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload2'
      x-centrify-anon: false
      summary: Get a list of all subnets in a specified list of regions
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetSubnetsForRegions'
      operationId: postAwsGetSubnetsForRegions
      x-operation-id-source: derived
  /Aws/GetVpcs:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Region:
                  type: string
                  description: The AWS region.
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                RRFormat:
                  type: string
                  description: 'Should response by in the redrock format (default: false) .'
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - Region
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Get a list of all VPC's in a given region
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsGetVpcs'
      operationId: postAwsGetVpcs
      x-operation-id-source: derived
  /Aws/ImportAccessKey:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload17'
      x-centrify-anon: false
      description: This will create the cloud provider and IAM user of the access key if they do not already exist.
      summary: Import AWS Access Key and Secret
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsImportAccessKey'
      operationId: postAwsImportAccessKey
      x-operation-id-source: derived
  /Aws/RetrieveAccessKey:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload23'
      x-centrify-anon: false
      summary: Retrieve an access key ID and secret access key for an IAM user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsRetrieveAccessKey'
      operationId: postAwsRetrieveAccessKey
      x-operation-id-source: derived
  /Aws/VerifyAccessKey:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload17'
      x-centrify-anon: false
      summary: Verify an AWS Access Key and Secret
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsVerifyAccessKey'
      operationId: postAwsVerifyAccessKey
      x-operation-id-source: derived
  /Aws/VerifyAccessKeyForUserAccount:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                AccessKeyId:
                  type: string
                  description: The AWS access key.
                UserName:
                  type: string
                  description: The IAM user name. If not provided, only the CloudProviderId will be validated.
                SecretAccessKey:
                  type: string
                  description: The AWS access secret.
                CloudProviderId:
                  type: string
                  description: The Cloud Provider that will use this access key.
              required:
              - AccessKeyId
              - SecretAccessKey
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Verify an AWS Access Key and Secret for an IAM User name and Cloud Provider
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsVerifyAccessKeyForUserAccount'
      operationId: postAwsVerifyAccessKeyForUserAccount
      x-operation-id-source: derived
  /Aws/VerifyAssumeRoleConfiguration:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RoleArn:
                  type: string
                  description: The AWS role to assume.
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - RoleArn
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Verify assume role configuration
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsVerifyAssumeRoleConfiguration'
      operationId: postAwsVerifyAssumeRoleConfiguration
      x-operation-id-source: derived
  /Aws/VerifySqsQueueConfiguration:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Region:
                  type: string
                  description: The AWS region for the queue.
                QueueUrl:
                  type: string
                  description: The URL of the queue
                IamAccountId:
                  type: string
                  description: The database ID of the IAM account.  If not supplied an AWS assumed role is used.
                CloudProviderId:
                  type: string
                  description: The database ID of the cloud provider.
              required:
              - Region
              - QueueUrl
              - CloudProviderId
              type: object
        required: true
      x-centrify-anon: false
      summary: Verify SQS queue configuration
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AwsVerifySqsQueueConfiguration'
      operationId: postAwsVerifySqsQueueConfiguration
      x-operation-id-source: derived
  /CloudProvider/AddCloudProvider:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ExternalId:
                  type: string
                  description: The external ID to be used with the RoleArn
                Type:
                  type: string
                  description: The type of the cloud provider.  Supported values are 'Aws'.
                RoleArn:
                  type: string
                  description: The ARN of an AWS role used for access account resources
                Description:
                  type: string
                  description: The description of the cloud provider
                Name:
                  type: string
                  description: The name of the cloud provider
              required:
              - Type
              - Name
              type: object
        required: true
      x-centrify-anon: false
      summary: AddCloudProvider - Adds a cloud provider
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderAddCloudProvider'
      operationId: postCloudProviderAddCloudProvider
      x-operation-id-source: derived
  /CloudProvider/DeleteCloudProvider:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload22'
      x-centrify-anon: false
      summary: DeleteCloudProvider - Deletes a cloud provider
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderDeleteCloudProvider'
      operationId: postCloudProviderDeleteCloudProvider
      x-operation-id-source: derived
  /CloudProvider/DeleteCloudProviders:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                SecretName:
                  type: string
                  description: Name of secret for account passwords
                SetQuery:
                  type: string
                  description: Set identifier or sql query for cloud providers  to be deleted
                Ids:
                  items:
                    type: string
                  type: array
                  description: List of Ids for the cloud providers to be deleted
                SaveToSecrets:
                  type: boolean
                  description: Choose to save passwords for cloud providers accounts to a csv secret file
                RunSync:
                  type: boolean
                  description: The operation will be executed synchronously if set to true. Defaults to false.
              type: object
        required: true
      x-centrify-anon: false
      description: 'Creates a asynchronous operation which will delete all cloud providers and associate accounts in the background.

        You must be a system administrator or have ''Delete'' permission on the cloud providers. Must provide either Ids or SetQuery for request.'
      summary: Creates a asynchronous operation which will delete all cloud providers
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderDeleteCloudProviders'
      operationId: postCloudProviderDeleteCloudProviders
      x-operation-id-source: derived
  /CloudProvider/GetAllCloudProviders:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload25'
      x-centrify-anon: false
      summary: GetAllCloudProviders - Gets all cloud providers
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderGetAllCloudProviders'
      operationId: postCloudProviderGetAllCloudProviders
      x-operation-id-source: derived
  /CloudProvider/GetCloudProvider:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload22'
      x-centrify-anon: false
      summary: GetCloudProvider - Gets a cloud provider
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderGetCloudProvider'
      operationId: postCloudProviderGetCloudProvider
      x-operation-id-source: derived
  /CloudProvider/GetCloudProviderCollectionPermissions:
    post:
      tags:
      - Resource Management
      requestBody:
        $ref: '#/components/requestBodies/Payload26'
      x-centrify-anon: false
      summary: Gets list of grants associated with a set of cloud providers
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderGetCloudProviderCollectionPermissions'
      operationId: postCloudProviderGetCloudProviderCollectionPermissions
      x-operation-id-source: derived
  /CloudProvider/GetCloudProviderPermissions:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: string
                  description: ID of the cloud provider
                RRFormat:
                  default: false
                  type: boolean
                  description: Return data in database format.
              type: object
        required: true
      x-centrify-anon: false
      summary: Gets list of grants associated with a cloud provider
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderGetCloudProviderPermissions'
      operationId: postCloudProviderGetCloudProviderPermissions
      x-operation-id-source: derived
  /CloudProvider/SetCloudProviderCollectionPermissions:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: string
                  description: ID of the cloud provider set
                Grants:
                  properties:
                    Rights:
                      type: string
                      description: 'Comma separated list of permissions: Grant, View, Edit, Delete, Retrieve, None'
                    Principal:
                      type: string
                      description: User name or role name
                    PType:
                      type: string
                      description: 'Principal type: User, Role'
                  type: object
                  description: 'Array of permissions to be set. Each item must include  Principal: User name or role name, PType: User, Role,  Rights: Grant, View, Edit, Delete, or None'
              required:
              - ID
              - Grants
              type: object
        required: true
      x-centrify-anon: false
      description: You must have 'Grant' permission on the cloud provider set.
      summary: Grant permissions on cloud provider sets
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderSetCloudProviderCollectionPermissions'
      operationId: postCloudProviderSetCloudProviderCollectionPermissions
      x-operation-id-source: derived
  /CloudProvider/SetCloudProviderPermissions:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: string
                  description: ID of the cloud provider
                Grants:
                  properties:
                    Rights:
                      type: string
                      description: 'Comma separated list of permissions: Grant, View, Edit, Delete, Retrieve, None'
                    Principal:
                      type: string
                      description: User name or role name
                    PrincipalId:
                      type: string
                      description: Uuid of the principal
                    PType:
                      type: string
                      description: 'Principal type: User, Role etc.'
                  type: object
                  description: 'Array of permissions to be set. Each item must include  Principal: User name or role name, PType: User, Role,  Rights: Grant, View, Edit, Delete, Retrieve, or None'
              required:
              - ID
              - Grants
              type: object
        required: true
      x-centrify-anon: false
      description: You must have 'Grant' permission on the cloud provider.
      summary: Grant permissions on cloud providers
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderSetCloudProviderPermissions'
      operationId: postCloudProviderSetCloudProviderPermissions
      x-operation-id-source: derived
  /CloudProvider/UpdateCloudProvider:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ExternalId:
                  type: string
                  description: The external ID to be used with the RoleArn
                ID:
                  type: string
                  description: The ID of the cloud provider.
                Type:
                  type: string
                  description: The type of the cloud provider.  Supported values are 'Aws'.
                RoleArn:
                  type: string
                  description: The ARN of an AWS role used for access account resources
                Description:
                  type: string
                  description: The description of the cloud provider
                Name:
                  type: string
                  description: The name of the cloud provider
              required:
              - ID
              - Type
              type: object
        required: true
      x-centrify-anon: false
      summary: UpdateCloudProvider - Updates a cloud provider
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CloudProviderUpdateCloudProvider'
      operationId: postCloudProviderUpdateCloudProvider
      x-operation-id-source: derived
  /Collection/GetCollectionPermissions:
    post:
      tags:
      - Resource Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  type: string
                  description: ID of the collection, set to null to get global permissions
              required:
              - ID
              type: object
        required: true
      x-centrify-anon: false
      summary: Get list of permissions associated with a set
