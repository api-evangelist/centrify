                        EndTime:
                          type: string
                          description: time when assignment ends.  Specifies as "YYYY-MM-DDThh:mm:ss.000Z".  Used when "AssignmentType" is "window"
                        StartTimeInterval:
                          type: integer
                          description: unit for assignment starts after approval in minutes.  Specify 60 for hour, 1440 for day. Used when "AssignmentType" is "temp"
                        EndTimeInterval:
                          type: integer
                          description: unit for assignment duration in minutes. Specify 60 for hour, 1440 for day.  Used when "AssignmentType" is "temp"
                        StartTime:
                          type: string
                          description: time when assignment starts.  Specifies as "YYYY-MM-DDThh:mm:ss.000Z". Used when "AssignmentType" is "window"
                        RunAsUser:
