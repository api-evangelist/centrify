        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: http
          code: "\nExample 1: Using Mode 1 to open a session on the system specified by the host parameter and to log in using the credentials of the account specified via pvacct:\nGET /serversession/jumpterm?mode=1&pvacct=dddddddd-1d1d-473b-9ca4-cbc2d53b6061&hostname=csssup-ubuntu&height=480&width=640&debug=false&token=&host=abcdabcd-7461-4be6-982f-afb256770c3e&colrows=&title=Login%20session%20csssup-ubuntu \n\n\nExample 2: Using Mode 3 to open a session and log in manually directly on the system. In this example, the host parameter specifies the system to log in to, but pvacct is not used since login will take place directly on the system:\nGET /serversession/jumpterm?mode=3&host=1c888888-b31c-4c20-89f2-53cea844a930&hostname=204&height=480&width=640&title=Login%20session%20204\n\n\nExample 3: Using Mode 4 to open a session in which you can watch/view another session in realtime. Here the host value is composed of the host ID and the connection ID separated by a pipe character:\nGET /serversession/jumpterm?mode=4&sess=d9754444-822e-4c85-853d-c99046ff0d8e&height=36&width=104&host=1c77357a-b31c-4c20-89f2-53cea844a930&prxid=248c2b5f-398e-47e8-99e0-0206b568a239|3352d893-db9e-4b06-91d9-3e8b409e91a3&title=Watch%20session%20204\n\n\nExample 4: Using Mode 5 to open a session using an AD login:\nGET /serversession/jumpterm?mode=5&host=d7044444-ca2f-48e0-9cb8-c0446a6e2a1f&hostname=206&height=768&width=1024&title=Login%20session%20206"
        samples-languages:
        - http
      tags:
      - Jumpterm
