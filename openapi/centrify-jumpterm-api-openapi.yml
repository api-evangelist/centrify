openapi: 3.2.0
info:
  title: server-session Jumpterm API
  version: '23.1'
servers:
- url: https://example.com/serversession
security:
- {}
tags:
- name: Jumpterm
paths:
  /jumpterm:
    get:
      summary: /serversession/jumpterm
      description: Generates HTML information to display an SSH/RDP session for a remote system. After constructing the full endpoint URL, you can either redirect your browser to the URL or open a new browser window setting the URL as the source.
      operationId: serversessionjumpterm
      parameters:
      - name: mode
        in: query
        description: Specifies the type of remote session. Set to 1 to open a session using credentials for an account specified through the `pvacct` parameter. Set to 3 to open a session for manual login, specifying the `host` parameter instead of `pvacct`. Set to 4 to open a session in which you can watch another session. Set to 5 to open a session using AD login.
        schema:
          type: integer
          format: int32
      - name: pvacct
        in: query
        description: The ID of the login account to use on the remote system.
        schema:
          type: string
      - name: hostname
        in: query
        description: The name of the remote system.
        schema:
          type: string
      - name: height
        in: query
        description: The height of the window, in pixels.
        schema:
          type: integer
          format: int32
      - name: width
        in: query
        description: The width of the window, in pixels.
        schema:
          type: integer
          format: int32
      - name: debug
        in: query
        schema:
          type: boolean
      - name: token
        in: query
        schema:
          type: string
      - name: host
        in: query
        description: The unique ID of the remote system to log in to.
        schema:
          type: string
      - name: colrows
        in: query
        schema:
          type: string
      - name: Title
        in: query
        description: The title that is to appear at the top of the browser session window that is displayed.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "HTTP/1.1 200 OK\nCache-Control: private\nContent-Type: text/html; charset=utf-8\nVary: Accept-Encoding\nX-CFY-TX-PN: Pod9\nX-CFY-TX-ID: 5da94240bbc84fcf8056175b532f634c\nX-CFY-TX-DT: Mi8xMi8yMDE4IDU6MTk6MjUgUE0_\nX-Frame-Options: SAMEORIGIN\nP3P: CP=\"NON COR ADMa CURa DEVa OUR IND COM UNI NAV INT PRE LOC ONL PHY STA ONL\"\nX-CFY-TX-TM: 157\nSet-Cookie: antixss=k7fkHgxR28e_LmPvaWG4Fg__-HWPt3M1f5gWW3BT7bxuDag__-dImPD1A3pR_0xIXnkZ21Tw__-WrUho88cTg_DtvESULbtgA__-LS971c84V3ycyD4qIcxHeQ__-bPcBoJBIzWH3zMb54gPmBA__-n6WNZMK9lcgEq6K_R_Z22w__-ilI45jB0S4IdTwakrYuf7w__; path=/; secure\nSet-Cookie: sessdata=L3dVSF...; path=/; secure; HttpOnly\nSet-Cookie: podloc=eyJkZXZkb2cuY...; domain=centrify.com; expires=Fri, 31-Dec-9999 23:59:59 GMT; path=/; secure\nSet-Cookie: userdata=eyJEYXR...; expires=Wed, 14-Mar-2018 17:19:25 GMT; path=/; secure\nX-Robots-Tag: noindex, nofollow\nDate: Mon, 12 Feb 2018 17:19:25 GMT\nContent-Length: 4346\n\n\n<!DOCTYPE html>\n<html>\n    <head>\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=8,9,10\" />\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n        <link rel=\"shortcut icon\"/>\n\n            <link rel=\"stylesheet\" type=\"text/css\" href=\"/vfslow/lib/ui/../uibuild/compiled/centrify/production/resources/centrify-all_01.css?_ver=1518281911\"/>\n            <link rel=\"stylesheet\" type=\"text/css\" href=\"/vfslow/lib/ui/../uibuild/compiled/centrify/production/resources/centrify-all_02.css?_ver=1518281911\"/>\n            <link rel=\"stylesheet\" type=\"text/css\" href=\"/vfslow/lib/ui/../uibuild/compiled/centrify/production/resources/centrify-all_03.css?_ver=1518281911\"/>\n\n        <style>\n            .x-viewport body{\n                overflow: hidden !important;\n                background-color: #000;\n            }\n        </style>\n\n        <script src=\"/vfslow/lib/ui/jsutil/resources/locale/en.js?_ver=1518281911\"></scr