openapi: 3.2.0
info:
  termsOfService: http://developer.centrify.com/license
  title: Centrify Identity Platform Application Management API
  version: 23.1.261-447315
  description: This site provides basic reference material for the Centrify Identity Platform API.
tags:
- description: Manage applications and SaaS
  name: Application Management
paths:
  /Core/GetPurchasedLicenses:
    post:
      tags:
      - Application Management
      x-centrify-anon: false
      description: List of product licenses, by group and with counts.
      summary: Retrieves a list of product licenses for this tenant, from Salesforce
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CoreGetPurchasedLicenses'
      operationId: postCoreGetPurchasedLicenses
      x-operation-id-source: derived
  /OAuth2/GetMeta:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Service name to use when gathering meta data.
        name: serviceName
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Payload31'
      x-centrify-anon: true
      summary: Get meta
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OAuth2GetMeta'
      operationId: postOAuth2GetMeta
      x-operation-id-source: derived
  /SaasManage/CheckIfAppsHaveUpdates:
    post:
      tags:
      - Application Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                appkeys:
                  items:
                    type: string
                  type: array
                  description: List of application keys
              required:
              - appkeys
              type: object
        required: true
      x-centrify-anon: false
      summary: Check if the apps are up to latest which is the template version in the app…
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageCheckIfAppsHaveUpdates'
      operationId: postSaasManageCheckIfAppsHaveUpdates
      x-operation-id-source: derived
  /SaasManage/DeleteApplication:
    post:
      tags:
      - Application Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                _RowKey:
                  items:
                    type: string
                  type: array
                  description: Application key
              required:
              - _RowKey
              type: object
        required: true
      x-centrify-anon: false
      summary: Delete an application
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageDeleteApplication'
      operationId: postSaasManageDeleteApplication
      x-operation-id-source: derived
  /SaasManage/GetAllUpdatableApps:
    post:
      tags:
      - Application Management
      x-centrify-anon: false
      summary: Returns a list of all apps that can be updated
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageGetAllUpdatableApps'
      operationId: postSaasManageGetAllUpdatableApps
      x-operation-id-source: derived
  /SaasManage/GetAppCreds:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: ''
        name: appKey
        schema:
          type: string
      x-centrify-anon: false
      summary: Returns credentials required to launch the app
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageGetAppCreds'
      operationId: postSaasManageGetAppCreds
      x-operation-id-source: derived
  /SaasManage/GetAppIDByServiceName:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: service name
        name: name
        schema:
          type: string
      x-centrify-anon: false
      summary: Gets the ID of an app from its service name
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageGetAppIDByServiceName'
      operationId: postSaasManageGetAppIDByServiceName
      x-operation-id-source: derived
  /SaasManage/GetAppUnsupportedList:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: ''
        name: includeDeadApps
        schema:
          type: string
      x-centrify-anon: false
      summary: Returns a list of apps that are no longer supported
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageGetAppUnsupportedList'
      operationId: postSaasManageGetAppUnsupportedList
      x-operation-id-source: derived
  /SaasManage/GetApplication:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: App key
        name: _RowKey
        schema:
          type: string
      x-centrify-anon: false
      summary: Get information for an application
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageGetApplication'
      operationId: postSaasManageGetApplication
      x-operation-id-source: derived
  /SaasManage/GetTemplatesAndCategories:
    post:
      tags:
      - Application Management
      x-centrify-anon: false
      summary: Get information for application templates
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageGetTemplatesAndCategories'
      operationId: postSaasManageGetTemplatesAndCategories
      x-operation-id-source: derived
  /SaasManage/ImportAppFromTemplate:
    post:
      tags:
      - Application Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ID:
                  items:
                    type: string
                  type: array
                  description: Application template name
              required:
              - ID
              type: object
        required: true
      x-centrify-anon: false
      summary: Create an application
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageImportAppFromTemplate'
      operationId: postSaasManageImportAppFromTemplate
      x-operation-id-source: derived
  /SaasManage/IsApplicationAvailableInCatalog:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: ''
        name: appKey
        schema:
          type: string
      x-centrify-anon: false
      summary: Checks if Application is still available in the catalog
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageIsApplicationAvailableInCatalog'
      operationId: postSaasManageIsApplicationAvailableInCatalog
      x-operation-id-source: derived
  /SaasManage/RefreshApplicationBinaryFileMetadata:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Row key for the application
        name: appKey
        schema:
          type: string
      - required: true
        in: query
        description: Name of the file
        name: filename
        schema:
          type: string
      - required: true
        in: query
        description: The uploadSessionId if already known
        name: uploadSessionId
        schema:
          type: string
      - required: true
        in: query
        description: The MD5 calculated by the caller. Optional
        name: md5
        schema:
          type: string
      x-centrify-anon: false
      summary: Refresh the file metadata in case the file has been changed by direct upload to…
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageRefreshApplicationBinaryFileMetadata'
      operationId: postSaasManageRefreshApplicationBinaryFileMetadata
      x-operation-id-source: derived
  /SaasManage/RequestAppUploadUrl:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Row key for the application
        name: appKey
        schema:
          type: string
      - required: true
        in: query
        description: Name of the file
        name: filename
        schema:
          type: string
      - required: true
        in: query
        description: The uploadSessionId if already known. Optional
        name: uploadSessionId
        schema:
          type: string
      - required: true
        in: query
        description: "The context of this invocation, empty for starting the chunked upload process. If the first invocation returns an Aws-PreSigned method, \n                                  then subsequent invocations will contain UploadId and PartNumber.  UploadID is obtained from Amazon, and PartNumber indicates what chunk\n                                  the requested URL is for. If the PartNumber is 0, this request will be considered a \"finalization\" request."
        name: context
        schema:
          type: string
      x-centrify-anon: false
      summary: Retrieve a publicly uploadable, SAS key secured URL (for Azure) or presigned…
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageRequestAppUploadUrl'
      operationId: postSaasManageRequestAppUploadUrl
      x-operation-id-source: derived
  /SaasManage/UpdateApplicationDE:
    post:
      tags:
      - Application Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ShowRegistration:
                  type: boolean
                  description: Whether to show registration link
                _RowKey:
                  type: string
                  description: Application key
                Handler:
                  type: string
                  description: Application handler
                IconUri:
                  type: string
                  description: Icon path
                AppRoles:
                  type: object
                  description: To assign or un-assign roles for accessing the application
                Description:
                  type: string
                  description: Application description
                Name:
                  type: string
                  description: Application name
              required:
              - _RowKey
              type: object
        required: true
      x-centrify-anon: false
      summary: Update an application
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasManageUpdateApplicationDE'
      operationId: postSaasManageUpdateApplicationDE
      x-operation-id-source: derived
  /UPRest/GetAppByKey:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Application key
        name: appkey
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                markAppVisited:
                  default: false
                  type: string
                  description: Should the application be mark as visited.
              type: object
        required: true
      x-centrify-anon: false
      summary: Get an application's data
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UPRestGetAppByKey'
      operationId: postUPRestGetAppByKey
      x-operation-id-source: derived
  /UPRest/GetResultantAppsForUser:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Target user uuid.
        name: userUuid
        schema:
          type: string
      x-centrify-anon: false
      description: Your must have user management rights to invoke this API. This call caches the list of applications and roles. Personal apps are not included in the result.
      summary: Return a user's portal applications and how the user has access to each…
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UPRestGetResultantAppsForUser'
      operationId: postUPRestGetResultantAppsForUser
      x-operation-id-source: derived
  /UPRest/GetTagsForApp:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Application key
        name: appkey
        schema:
          type: string
      x-centrify-anon: false
      summary: Get the list of application tags for the current user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UPRestGetTagsForApp'
      operationId: postUPRestGetTagsForApp
      x-operation-id-source: derived
  /UPRest/GetUPData:
    post:
      tags:
      - Application Management
      parameters:
      - required: true
        in: query
        description: Whether to use the cache. If set to true, the call does not use the cache.
        name: force
        schema:
          type: string
      - required: true
        in: query
        description: Target user name.
        name: username
        schema:
          type: string
      x-centrify-anon: false
      description: This call caches the list of applications but does not cache tag information.
      summary: Gets all available data for the user portal in one call
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UPRestGetUPData'
      operationId: postUPRestGetUPData
      x-operation-id-source: derived
  /UPRest/SetUserCredsForApp:
    post:
      tags:
      - Application Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Password:
                  type: string
                  description: Application password
                appkey:
                  type: string
                  description: Application key
                Username:
                  type: string
                  description: Application user name
              required:
              - Password
              - appkey
              - Username
              type: object
        required: true
      x-centrify-anon: false
      summary: Set user credentials for an application
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UPRestSetUserCredsForApp'
      operationId: postUPRestSetUserCredsForApp
      x-operation-id-source: derived
  /UPRest/UpsertTagsForApp:
    post:
      tags:
      - Application Management
      requestBody:
        content:
          application/json:
            schema:
              properties:
                appkey:
                  type: string
                  description: Application key
                tagnames:
                  items:
                    type: string
                  type: array
                  description: list of tag names
              required:
              - appkey
              - tagnames
              type: object
        required: true
      x-centrify-anon: false
      summary: Add and update application tags for the current user
      responses:
        '200':
          description: API-Result
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UPRestUpsertTagsForApp'
      operationId: postUPRestUpsertTagsForApp
      x-operation-id-source: derived
components:
  schemas:
    UPRestUpsertTagsForApp:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: Whether the operation is successful or not.
          type: object
        Message:
          type: string
          description: Error message text on failure, may be null
