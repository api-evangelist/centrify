              description: Whether the operation is successful
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    CoreGetPurchasedLicenses:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: "List of product licenses.\n                {  \n                    \"type\": \"object\",\n                    \"description\": \"Collections of license objects.\",\n                    \"properties\": \n                    {\n                        \"Name\" : { \"description: \"Product name, e.g. App Service Access\", \"type\": \"string\" },\n                        \"Group\" : { \"description: \"Product Category, e.g. App Services\", \"type\": \"string\" },\n                        \"licensed\": { \"description: \"Count of purchased licenses\", \"type\": \"numeric\" },\n                        \"info\": { \"description: \"Optional description or web page of product.\", \"type\": \"string\" }\n                    }\n                }        \n            \n            "
          type: object
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    OAuth2GetMeta:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: ContentResult that describes the service name meta data.
          type: object
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    SaasManageGetAppUnsupportedList:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: "\n            Returns the list of Unsupported(Created before Centrify/Idaptive split and no more supported by Centrify) Applications in the tenant.\n            "
          type: object
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    SaasManageUpdateApplicationDE:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: Result
          type: object
          properties:
            State:
              type: integer
              description: Application state
            success:
              type: boolean
              description: Whether the operation is successful
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    SaasManageDeleteApplication:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: Result
          type: object
          properties:
            _RowKey:
              type: string
              description: Application key
            success:
              type: boolean
              description: Whether the operation is successful
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    SaasManageCheckIfAppsHaveUpdates:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: "\n            Return a map. The key is the appkey and the value is the status.\n            "
          type: object
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    SaasManageRequestAppUploadUrl:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: File information and metadata object
          type: object
          properties:
            FilePath:
              type: string
              description: The distributed filesystem's file path
            Location:
              type: string
              description: The URL where the file can be requested or uploaded.
            UploadSessionId:
              type: string
              description: The uploadSessionId so we can associate multiple calls to RequestAppUploadUrl together and construct the same binaryFilePath
            Method:
              type: string
              description: The method a client should use for uploading the chunks.
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    UPRestGetAppByKey:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: Application data
          type: object
          properties:
            AdminTag:
              type: string
              description: Application admin tag
            Intranet:
              type: boolean
              description: Whether the application is an intranet app
            Category:
              type: string
              description: Application category
            Shortcut:
              type: boolean
              description: Whether the application has been set for optional installation
            DisplayName:
              type: string
              description: Application display name
            AppType:
              type: string
              description: Application type
            UsernameRO:
              type: boolean
              description: Whether user name is read-only
            PasswordIsSet:
              type: boolean
              description: Whether the password has been set
            AppKey:
              type: string
              description: Application key
            Rank:
              type: integer
              description: Application rank
            WebAppTypeDisplayName:
              type: string
              description: Display name of web-app-type
            Username:
              type: string
              description: Application username
            TemplateName:
              type: string
              description: Application template name
            Icon:
              type: string
              description: Path of application icon image
            AppTypeDisplayName:
              type: string
              description: Display name of application type
            WebAppType:
              type: string
              description: Application web-app-type
            Url:
              type: string
              description: Application Url
            Description:
              type: string
              description: Application description
            Name:
              type: string
              description: Application name
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    SaasManageIsApplicationAvailableInCatalog:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: False if app is not found in tenants application table OR appKey's template is not found in the global catalog. True otherwise
          type: object
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    UPRestGetResultantAppsForUser:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: A list of applications including how the user has access
          type: object
          properties:
            Intranet:
              type: boolean
              description: Whether the application is an intranet app
            AdminTag:
              type: string
              description: Application admin tag
            Category:
              type: string
              description: Application category
            Shortcut:
              type: boolean
              description: Whether the application has been set for optional installation
            DisplayName:
              type: string
              description: Application display name
            AppType:
              type: string
              description: Application type
            UsernameRO:
              type: boolean
              description: Whether user name is read-only
            ID:
              type: string
              description: Application ID
            PasswordIsSet:
              type: boolean
              description: Whether the password has been set
            AppKey:
              type: string
              description: Application key
            Rank:
              type: integer
              description: Application rank
            WebAppTypeDisplayName:
              type: string
              description: Display name of web-app-type
            Username:
              type: string
              description: Application username
            TemplateName:
              type: string
              description: Application template name
            Icon:
              type: string
              description: Path of application icon image
            AppTypeDisplayName:
              type: string
              description: Display name of application type
            Automatic:
              type: boolean
              description: Whether the application has been set for automatic installation
            AccessList:
              items:
                type: object
              type: array
              description: How user got acess to the application; each entry is a dictionary including 'Type' (User, Role), 'ID' (role/user UUID), and 'Name' (role name or 'User' if user is granted direct access)
            Url:
              type: string
              description: Application Url
            WebAppType:
              type: string
              description: Application web-app-type
            Description:
              type: string
              description: Application description
            Name:
              type: string
              description: Application name
        Message:
          type: string
          description: Error message text on failure, may be null
        success:
          type: boolean
          description: Indicates API success or failure
      type: object
    UPRestGetUPData:
      properties:
        ErrorID:
          type: string
          description: Unique support identifier for this occurrence of an error
        Result:
          description: A list of applications
          type: object
          properties:
            Intranet:
              type: boolean
              description: Whether the application is an intranet app
            _RowKey:
              type: string
              description: Application ID
            AdminTag:
              type: string
              description: Application admin tag
            Category:
              type: string
              description: Application category
            Shortcut:
              type: boolean
              description: Whether the application has been set for optional installation
            DisplayName:
              type: string
              description: Application display name
            AppType:
              type: string
              description: Application type
            UsernameRO:
              type: boolean
              description: Whether user name is read-only
            PasswordIsSet:
              type: boolean
              description: Whether the password has been set
            AppKey:
              type: string
              description: Application key
            Rank:
              type: integer
              description: Application rank
            WebAppTypeDisplayName:
              type: string
              description: Display name of web-app-type
            Username:
              type: string
              description: Application username
            TemplateName:
              type: string
              description: Application template name
            Icon:
              type: string
              description: Path of application icon image
            AppTypeDisplayName:
              type: string
              description: Display name of application type
            Personal:
              type: boolean
              description: Whether the application is a self-service application.
            Automatic:
              type: boolean
              description: Whether the application has been set for automatic installation
            Url:
              type: string
              description: Application Url
