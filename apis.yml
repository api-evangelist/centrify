aid: centrify

name: Centrify

description: Centrify is an identity and privileged access management (PAM) platform now delivered as part of Delinea (the company formed from
  the Centrify + Thycotic merger). The Centrify Identity Platform / Cloud Suite / Privileged Access Service secures access to applications, servers,
  network infrastructure, and privileged accounts with adaptive multi-factor authentication, single sign-on, least-privilege enforcement, session
  auditing, and analytics. The Centrify REST API exposes the full platform programmatically — authentication profiles, users and directories,
  roles and sets, resources and secrets, privileged access requests, connectors, webhooks, and audit/reporting — authenticated via OAuth2, bearer
  tokens, or MFA-aware session cookies. centrify.com now redirects to delinea.com and the developer documentation is served at developer.delinea.com.

